name: Guide up to date

# Fails if GUIDE.md's autogenerated methods table is stale relative to the
# tool registrations in src/. Regenerate locally with:
#   node scripts/gen-guide.mjs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify GUIDE.md is regenerated
        run: node scripts/gen-guide.mjs --check

      - name: Workflow files are parseable
        # Not a formality: .github/workflows/sync-upstream.yml sat
        # unparseable (a backslash line-continuation broke the `run: |`
        # block) from 2026-07-23 until 2026-08-06 — GitHub silently failed
        # EVERY run with "workflow file issue", so fork auto-update never
        # ran once for any self-hoster. One YAML parse catches this
        # immediately.
        run: |
          python3 -m pip install --quiet 'PyYAML>=6,<7'
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for p in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all workflow files parse")
          PY
